name: Docker CD

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (ex: 1.0.0-RC1)"
        required: true
        type: string

permissions:
  contents: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  publish:
    name: Build and push Docker image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            SOURCE_REF="${{ github.event.pull_request.head.ref }}"
            VERSION="${SOURCE_REF#release/}"

            if [ -z "$VERSION" ] || [ "$VERSION" = "$SOURCE_REF" ]; then
              echo "Unable to extract version from source ref: $SOURCE_REF"
              exit 1
            fi
          fi

          if [ -z "$VERSION" ]; then
            echo "Release version input is empty."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version format
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'; then
            echo "Invalid release version: $VERSION"
            echo "Expected examples: 1.0.0, 1.0.0-RC1, 2.1.3"
            exit 1
          fi

      - name: Compare release version with package.json
        shell: bash
        run: |
          RELEASE_VERSION='${{ steps.version.outputs.version }}'
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          echo "Release version: $RELEASE_VERSION"
          echo "package.json version: $PACKAGE_VERSION"

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: release/$RELEASE_VERSION != package.json ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create and push Git tag on main merge commit
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          TAG='${{ steps.version.outputs.git_tag }}'
          TARGET_SHA='${{ github.event.pull_request.merge_commit_sha }}'

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "Release $TAG"
          git push origin "$TAG"
